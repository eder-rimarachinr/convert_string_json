#user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Charset
        charset utf-8;

        # Security headers (see security-headers.conf for the inheritance caveat)
        include /etc/nginx/snippets/security-headers.conf;

        # Cache images/fonts long-term
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        # HTML/JS/CSS have no content hash in their names: always revalidate (cheap 304 via ETag)
        # so a deploy (e.g. a security fix) reaches returning visitors immediately.
        # index.html also references assets with ?v=<date>: bump it on every deploy so
        # browsers/CDNs holding an old copy (e.g. the former 1-year "immutable") fetch the new one.
        location ~* \.(css|js|html)$ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
        }

        # RFC 9116 security.txt (must be matched before the hidden-files rule)
        location ^~ /.well-known/ {
            default_type text/plain;
            try_files $uri =404;
        }

        # Main location
        location / {
            try_files $uri $uri/ /index.html;
        }

        # robots.txt
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # sitemap.xml
        location = /sitemap.xml {
            access_log off;
            log_not_found off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
